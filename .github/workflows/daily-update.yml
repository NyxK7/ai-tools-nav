name: 每日更新 AI 工具数据
on:
  schedule: [{cron: "0 0 * * *"}]  # 每天 UTC 0:00（北京时间 8:00）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Rank tools by public popularity signals
        run: python3 scripts/rank.py
        continue-on-error: true
      - name: 检查官网链接（失效的新收录条目自动移除，精选条目只报告）
        run: python scripts/linkcheck.py --prune-auto
        continue-on-error: true
      - name: 生成静态页面、sitemap、llms.txt
        run: python scripts/build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: 每日数据更新 $(date -u +%F)" && git push)
