name: 反馈 / 推荐工具
description: 报告失效链接、推荐新工具或提出建议
title: "[反馈] "
labels: ["feedback"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 反馈类型
      options: [推荐新工具, 链接失效/信息错误, 功能建议, 其他]
    validations: {required: true}
  - type: input
    id: tool
    attributes: {label: 相关工具名称与官网链接, placeholder: "例如：Cursor https://cursor.com"}
  - type: textarea
    id: detail
    attributes: {label: 详细说明}
    validations: {required: true}
